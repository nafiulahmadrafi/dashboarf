version: '3.9'\n\nservices:\n  backend:\n    image: node:latest\n    container_name: node_backend\n    working_dir: /usr/src/app\n    volumes:\n      - ./backend:/usr/src/app\n    ports:\n      - "3000:3000"\n    environment:\n      - NODE_ENV=production\n    restart: always\n    healthcheck:\n      test: ["CMD", "curl", "-f", "http://localhost:3000"]\n      interval: 30s\n      timeout: 10s\n      retries: 5\n\n  frontend:\n    image: node:latest\n    container_name: react_frontend\n    working_dir: /usr/src/app\n    volumes:\n      - ./frontend:/usr/src/app\n    ports:\n      - "3001:3000"\n    environment:\n      - NODE_ENV=production\n    restart: always\n    healthcheck:\n      test: ["CMD", "curl", "-f", "http://localhost:3001"]\n      interval: 30s\n      timeout: 10s\n      retries: 5\n\n  python_llm:\n    image: python:latest\n    container_name: python_llm\n    working_dir: /usr/src/app\n    volumes:\n      - ./python_llm:/usr/src/app\n    restart: always\n    healthcheck:\n      test: ["CMD", "curl", "-f", "http://localhost:5000"]\n      interval: 30s\n      timeout: 10s\n      retries: 5\n\n  n8n:\n    image: n8nio/n8n\n    container_name: n8n\n    environment:\n      - EXECUTIONS_MODE=queue\n    ports:\n      - "5678:5678"\n    restart: always\n    healthcheck:\n      test: ["CMD", "curl", "-f", "http://localhost:5678"]\n      interval: 30s\n      timeout: 10s\n      retries: 5\n\n  ollama:\n    image: ollama/ollama\n    container_name: ollama\n    ports:\n      - "8080:8080"\n    restart: always\n    healthcheck:\n      test: ["CMD", "curl", "-f", "http://localhost:8080"]\n      interval: 30s\n      timeout: 10s\n      retries: 5